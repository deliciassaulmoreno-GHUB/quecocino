<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuéCocino · Recetas con lo que tienes en casa</title>
  <meta name="description" content="Añade los ingredientes que tienes y descubre recetas de todo el mundo con vídeo animado paso a paso.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#/">🍳 Qué<b>Cocino</b></a>
    <nav>
      <a href="#/">Recetas</a>
      <a href="#/favoritos">♥ Favoritos <span id="fav-count" class="count-pill"></span></a>
    </nav>
  </header>

  <main>
    <!-- Inicio: ingredientes + resultados -->
    <div id="view-home">
      <section class="picker">
        <h1>¿Qué tienes en la cocina?</h1>
        <p class="lead">Añade tus ingredientes y te propongo recetas de todo el mundo. Sal, aceite, agua y pimienta se dan por hechos.</p>
        <div class="search">
          <input id="ing-input" type="text" placeholder="Escribe un ingrediente: tomate, pollo, arroz…" autocomplete="off" aria-label="Añadir ingrediente">
          <div id="suggest" class="suggest" hidden></div>
        </div>
        <div id="selected" class="chips selected"></div>
        <details open>
          <summary>Elegir de la lista</summary>
          <div id="catalog" class="catalog"></div>
        </details>
      </section>

      <section class="results">
        <h2 id="results-title"></h2>
        <div class="filters">
          <div id="cuisines" class="chips"></div>
          <div class="selects">
            <label>Dificultad
              <select id="f-dif"><option value="0">Cualquiera</option><option value="1">Fácil</option><option value="2">Media</option><option value="3">Difícil</option></select>
            </label>
            <label>Tiempo
              <select id="f-time"><option value="0">Cualquiera</option><option value="15">Hasta 15 min</option><option value="30">Hasta 30 min</option><option value="45">Hasta 45 min</option></select>
            </label>
            <label class="check" id="f-full-wrap" hidden><input type="checkbox" id="f-full"> Solo las que puedo hacer ya</label>
          </div>
        </div>
        <div id="grid" class="grid"></div>
      </section>
    </div>

    <!-- Detalle de receta -->
    <div id="view-recipe" hidden></div>

    <!-- Favoritos -->
    <div id="view-favs" hidden>
      <section class="results">
        <h1>Tus recetas favoritas</h1>
        <div id="fav-grid" class="grid"></div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
